<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    <meta property="og:description" content="A sample timing tool to help me learn rhythms">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rhythm Helper">
    <title>Rhythm Helper</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <style>
        #tap{
            width: 30vw;
            height: 30vh;
        }
    </style>

</head>

<body>
<button id="tap">Tap</button>
<div>
    <div>Tempo: <span id="bpm">–</span> BPM</div>
    <div>Jitter: <span id="jitter">–</span> ms</div>
</div>
<script>
    const ALPHA = 0.3;           // smoothing factor
    const MAX_SAMPLES = 8;      // jitter window
    const TIMEOUT_MS = 2000;    // inactivity reset
    const DEVIATION = 0.30;     // 30% cutoff

    let lastTapTime = null;
    let smoothedInterval = null;
    let intervals = [];
    let timeoutId = null;

    const bpmEl = document.getElementById('bpm');
    const jitterEl = document.getElementById('jitter');
    const tapBtn = document.getElementById('tap');

    tapBtn.addEventListener('click', registerTap);
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') registerTap();
    });

    function registerTap() {
        const now = performance.now();

        // Reset if tapping stopped
        if (lastTapTime && now - lastTapTime > TIMEOUT_MS) {
            reset();
        }

        if (lastTapTime !== null) {
            const interval = now - lastTapTime;

            // Initialize smoothing
            if (smoothedInterval === null) {
                smoothedInterval = interval;
            } else {
                // Deviation rejection
                const deviation = Math.abs(interval - smoothedInterval) / smoothedInterval;
                if (deviation > DEVIATION) {
                    lastTapTime = now;
                    return; // ignore bad tap
                }

                // Exponential smoothing
                smoothedInterval =
                    ALPHA * interval + (1 - ALPHA) * smoothedInterval;
            }

            // Store for jitter calculation
            intervals.push(smoothedInterval);
            if (intervals.length > MAX_SAMPLES) {
                intervals.shift();
            }

            updateDisplay();
        }

        lastTapTime = now;
        resetTimeout();
    }

    function updateDisplay() {
        if (smoothedInterval === null || intervals.length < 2) return;

        const bpm = 60000 / smoothedInterval;
        const jitter = stddev(intervals);

        bpmEl.textContent = bpm.toFixed(1);
        jitterEl.textContent = jitter.toFixed(1);
    }

    function stddev(arr) {
        const mean =
            arr.reduce((a, b) => a + b, 0) / arr.length;

        const variance =
            arr.reduce((sum, v) => sum + (v - mean) ** 2, 0) / arr.length;

        return Math.sqrt(variance);
    }

    function resetTimeout() {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(reset, TIMEOUT_MS);
    }

    function reset() {
        lastTapTime = null;
        smoothedInterval = null;
        intervals = [];
        bpmEl.textContent = '–';
        jitterEl.textContent = '–';
    }

</script>
</body>
</html>
